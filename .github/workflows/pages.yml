# Publishes the site, and turns GitHub Pages on if it is not already.
#
# `configure-pages` with `enablement: true` switches Pages on through the API using the
# workflow's own GITHUB_TOKEN, so the site can be published from a push instead of from the
# repository settings screen. That is the only reason this workflow exists rather than the
# simpler "deploy from a branch" setting.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a queued run supersedes a waiting one rather than piling up.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # The site is three static files at the repository root, so the whole checkout is the
      # artifact. There is nothing to build.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
